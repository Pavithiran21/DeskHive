# DeskHive on your machine in one command:
#
#   docker compose up --build
#   docker compose exec app java -jar /app/app.jar --spring.profiles.active=seed-demo --spring.main.web-application-type=none
#
# then open http://localhost:4000/demo (Log in as Employee / Admin; password DEMO_PASSWORD below).
# The seed builds the Northwind sample company. Set SMTP_* (e.g. a free Ethereal inbox) to see the emails.

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: deskhive-local-root
      MYSQL_DATABASE: deskhive_demo
    volumes:
      - deskhive-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pdeskhive-local-root']
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4000:4000'
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: deskhive_demo
      DB_USER: root
      DB_PASSWORD: deskhive-local-root
      COMPANY_NAME: Northwind
      JWT_SECRET: local-only-secret-change-me-0123456789abcdef
      JOB_TRIGGER_SECRET: local-only-job-secret-change-me-0123456789
      FRONTEND_URL: http://localhost:4000
      DEMO_MODE: 'true'
      DEMO_PASSWORD: deskhive-demo-1
      SMTP_HOST: ${SMTP_HOST:-smtp.ethereal.email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-set-me}
      SMTP_PASS: ${SMTP_PASS:-set-me}
      SMTP_FROM: ${SMTP_FROM:-DeskHive <bookings@deskhive.test>}

volumes:
  deskhive-mysql:
